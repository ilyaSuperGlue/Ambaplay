# Weekly refresh of compat/reported.json, the AppleGamingWiki CrossOver ratings that
# ambaplay.dev/compatibility shows as "Should work". The site reads the file from main,
# so a commit here is live without a deploy. Commits only when the game list changed.
name: compat-reported

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: compat-reported

# The branch the site reads. A scheduled run starts on the default branch, which is not
# always this one, so the job checks this branch out and pushes only to it.
env:
  TARGET_BRANCH: main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Fetch AppleGamingWiki ratings
        run: python3 scripts/compat-reported.py

      - name: Commit if the game list changed
        run: bash scripts/compat-reported-commit.sh
