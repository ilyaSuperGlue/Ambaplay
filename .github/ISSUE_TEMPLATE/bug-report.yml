name: Bug report
description: Something in Ambaplay doesn't work (setup, Steam, updates, controllers)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ambaplay is a hobby project maintained part-time, so answers are best-effort and can take a while. If a game won't start, check the [compatibility list](https://ambaplay.dev/compatibility) first; a game that doesn't run fits the Game report form better.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ambaplay version
      description: Shown at the bottom of the app's sidebar, for example "Ambaplay 3.0.1 (35)".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Pro M3, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach `~/Library/Application Support/ambaplay/ambaplay.log`. For a game, also
        attach its `ambaplay-run.log` (Prefixes page › the game › Open Log). For the
        installer, attach `~/Library/Logs/Ambaplay/installer.log`.
      render: text
