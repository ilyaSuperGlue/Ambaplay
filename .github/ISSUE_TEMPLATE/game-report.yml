name: Game report
description: Report how a Windows game runs under Ambaplay
title: "[Game] <name> (<appid>)"
labels: ["game-report"]
body:
  - type: markdown
    attributes:
      value: |
        **Have Ambaplay? You don't need this form.** After you play, the app asks how the game ran; one tap posts the report, log included, to [Compatibility reports](https://github.com/raymondchins/Ambaplay/discussions/categories/compatibility-reports) and it counts on the [compatibility list](https://ambaplay.dev/compatibility). Missed the question? Right-click the game on the Prefixes page and choose **Report This Game…**.

        This form is for anyone reporting without the app. A maintainer checks it and adds the result to the list by hand. Ambaplay is a hobby project maintained part-time, so that can take a while, and not every game can be fixed.

        Working from a Ambaplay checkout? Run `scripts/np-test-game.sh <appid> --stop` instead and attach the zipped `compat/runs/<appid>-<timestamp>/` folder.
  - type: input
    id: name
    attributes:
      label: Game name
    validations:
      required: true
  - type: input
    id: appid
    attributes:
      label: Steam AppID
      description: The number in the store URL.
      placeholder: "1966720"
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Graphics API of the game
      description: PCGamingWiki lists it; choose Unknown if unsure.
      options: [Unknown, D3D9, D3D10, D3D11, D3D12, Vulkan, OpenGL, "D3D11 + D3D12"]
    validations:
      required: true
  - type: input
    id: anticheat
    attributes:
      label: Anti-cheat
      description: Easy Anti-Cheat, BattlEye, Vanguard, VAC, none, etc.
      placeholder: none
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - platinum (perfect out of the box)
        - gold (perfect after tweaks)
        - silver (playable with minor issues)
        - bronze (runs, major issues)
        - borked (does not run)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend used
      options: [dxmt, dxvk, wined3d, d3dmetal, default (no gamefix)]
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine
      placeholder: WineCX 11.17
    validations:
      required: true
  - type: input
    id: fork_commit
    attributes:
      label: Ambaplay version
      description: Shown at the bottom of the app's sidebar (for example 3.0.1 (35)), or `git rev-parse --short HEAD` in a checkout.
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      description: Apple menu › About This Mac.
      options: [M1, M1 Pro, M1 Max, M1 Ultra, M2, M2 Pro, M2 Max, M2 Ultra, M3, M3 Pro, M3 Max, M3 Ultra, M4, M4 Pro, M4 Max, M5, M5 Pro, M5 Max, Other]
    validations:
      required: true
  - type: dropdown
    id: memory
    attributes:
      label: Memory (RAM)
      options: ["8 GB", "16 GB", "18 GB", "24 GB", "32 GB", "36 GB", "48 GB", "64 GB", "96 GB", "128 GB", "192 GB", "256 GB", "512 GB", Other]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model
      placeholder: MacBook Pro 14-inch, Mac mini, Mac Studio
  - type: input
    id: settings
    attributes:
      label: In-game settings and frame rate
      placeholder: 1440p, High, MetalFX Quality, ~60 fps
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What works, what breaks (black screen, crash on load, missing audio, input), settings or gamefix keys used.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag and drop `ambaplay-run.log`, or the zipped `compat/runs/<appid>-<timestamp>/` folder, or paste `result.json`.
